<body id="content" class="p-4"></body>
<script>
  // Listen for HTML content from parent
  window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'RENDER_HTML') {
      document.getElementById('content').innerHTML = event.data.html;
    }
  });

  // Handle clicks on elements with data-action
  document.addEventListener('click', function(e) {
    var target = e.target.closest('[data-action]');
    if (target) {
      e.preventDefault();
      e.stopPropagation();
      window.parent.postMessage({
        type: 'ACTION',
        action: target.getAttribute('data-action') || '',
        payload: target.getAttribute('data-payload') || ''
      }, '*');
    }
  });

  // Handle form submissions
  document.addEventListener('submit', function(e) {
    e.preventDefault();
    var form = e.target;
    if (form.dataset && form.dataset.action) {
      var formData = new FormData(form);
      var data = {};
      formData.forEach(function(value, key) {
        data[key] = value;
      });
      window.parent.postMessage({
        type: 'ACTION',
        action: form.dataset.action,
        payload: JSON.stringify(data)
      }, '*');
    }
  });

  // Signal ready to parent
  window.parent.postMessage({ type: 'SANDBOX_READY' }, '*');
</script>
